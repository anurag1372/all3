<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All3 Academic Sync</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #14161f;
      --card-inner: rgba(255, 255, 255, 0.03);
      --border: #232533;
      --border-highlight: rgba(255, 255, 255, 0.14);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.4);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      padding: 22px 20px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    /* ─── Header ────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-logo {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--card-bg);
      border: 1px solid var(--border-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #818cf8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
    }

    .header-title-group {
      display: flex;
      flex-direction: column;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff, #c7d2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .header-sub {
      font-size: 10.5px;
      color: var(--text-dim);
      font-weight: 500;
      margin-top: 1px;
    }

    .badge-v {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.28);
      color: #a5b4fc;
      letter-spacing: 0.02em;
    }

    /* ─── Status Card ────────────────────────────────────── */
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 14px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 0;
    }

    .status-label {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
    }

    .indicator {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
    }

    .dot {
      width: 7.5px;
      height: 7.5px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: all 0.25s ease;
    }

    .dot.online {
      background: var(--success);
      box-shadow: 0 0 8px var(--success-glow);
    }

    .dot.offline {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger-glow);
    }

    /* ─── Actions & Buttons ──────────────────────────────── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 11px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: -0.01em;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #ffffff;
      box-shadow: 0 3px 12px var(--accent-glow);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 5px 16px var(--accent-glow);
    }

    .btn-primary:active {
      transform: translateY(0);
      filter: brightness(0.95);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: var(--card-inner);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 550;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-highlight);
      color: #ffffff;
    }

    /* ─── Split Footer: 50% Status / 50% GitHub ──────────── */
    .footer-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: stretch;
    }

    .log-container {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      overflow: hidden;
    }

    .log-icon {
      font-size: 11px;
      opacity: 0.75;
      flex-shrink: 0;
    }

    .log-msg {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .btn-github-split {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--text);
      font-size: 11.5px;
      font-weight: 550;
      text-decoration: none;
      transition: all 0.2s ease;
      min-height: 38px;
    }

    .btn-github-split:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--border-highlight);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-github-split .arrow {
      font-size: 10px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="header-title-group">
      <h1>All3 Sync</h1>
      <span class="header-sub">Chrome Gradescope Connector</span>
    </div>
    <span class="badge-v">v1.0</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Local Server (3000):</span>
      <span class="indicator" id="server-status">
        <span class="dot" id="server-dot"></span>
        <span id="server-text">Checking...</span>
      </span>
    </div>
    <div class="status-row">
      <span class="status-label">Gradescope Cookies:</span>
      <span class="indicator" id="cookie-status">
        <span class="dot" id="cookie-dot"></span>
        <span id="cookie-text">Checking...</span>
      </span>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="btn-sync">⚡ Sync Now</button>
    <a href="http://127.0.0.1:3000" target="_blank" rel="noopener noreferrer" class="btn-secondary">Open Local Dashboard ↗</a>
  </div>

  <div class="footer-split">
    <div class="log-container" title="Sync Status">
      <span class="log-icon">ℹ️</span>
      <div class="log-msg" id="log-msg">Initialized</div>
    </div>
    <a href="https://github.com/anurag1372/all3" target="_blank" rel="noopener noreferrer" class="btn-github-split" title="Developer GitHub / Repository">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span>anurag1372</span>
      <span class="arrow">↗</span>
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
